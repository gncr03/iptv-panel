<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Benim TV</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#0a0a0f;color:#fff;min-height:100vh}
.ust{background:#15151f;padding:14px 14px 10px;position:sticky;top:0;z-index:10;border-bottom:1px solid #2a2a3a}
.logo{font-weight:bold;font-size:19px} .logo span{color:#f5c518}
.ara{width:100%;margin-top:12px;padding:11px 12px;background:#0f0f16;border:1px solid #2a2a3a;border-radius:10px;color:#fff;outline:none}
.sekmeler{display:flex;gap:8px;margin-top:12px}
.sekme{flex:1;padding:10px;border-radius:10px;border:1px solid #2a2a3a;background:#0f0f16;color:#aaa;text-align:center;font-size:13px;font-weight:bold;cursor:pointer}
.sekme.aktif{background:#f5c518;color:#000;border-color:#f5c518}
#oynatici{display:none;background:#000;padding:10px}
video{width:100%;border-radius:12px;background:#000;max-height:280px}
#kanalAdi{font-size:14px;margin-top:8px;font-weight:bold}
.liste{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kart{background:#15151f;border:1px solid #2a2a3a;border-radius:14px;padding:12px;cursor:pointer}
.kart img{width:100%;height:70px;object-fit:contain;background:#0f0f16;border-radius:10px}
.kart b{font-size:12px;display:block;margin-top:8px;line-height:1.3;min-height:30px}
.kart small{color:#f5c518;font-size:11px}
.giris{max-width:380px;margin:30px auto;padding:24px;background:#15151f;border:1px solid #2a2a3a;border-radius:20px}
.giris h1{text-align:center;font-size:22px} .giris p{text-align:center;color:#999;font-size:13px;margin:6px 0 18px}
label{font-size:12px;color:#aaa;display:block;margin:12px 0 6px}
input{width:100%;padding:12px;background:#0f0f16;border:1px solid #2a2a3a;border-radius:10px;color:#fff}
button{width:100%;margin-top:18px;padding:13px;background:#f5c518;border:none;border-radius:10px;font-weight:bold;font-size:15px}
#durum{text-align:center;font-size:12px;color:#ff9a9a;margin-top:10px}
</style>
</head>
<body>

<div id="loginSayfa" class="giris">
  <h1>📺 Benim TV</h1>
  <p>Yasal aboneliğin ile giriş yap</p>
  <label>Sunucu URL</label>
  <input id="server" placeholder="http://ornek.com:8080" value="http://2233030.cc:8080">
  <label>Kullanıcı Adı</label>
  <input id="user" placeholder="Kullanıcı adın" value="ahmetgncr">
  <label>Şifre</label>
  <input id="pass" type="password" placeholder="Şifren">
  <button onclick="girisYap()">GİRİŞ YAP</button>
  <div id="durum"></div>
</div>

<div id="panel" style="display:none">
  <div class="ust">
    <div class="logo">📺 BENİM <span>TV</span></div>
    <input class="ara" id="arama" placeholder="Kanal / film ara..." oninput="listele()">
    <div class="sekmeler">
      <div class="sekme aktif" id="sekme-canli" onclick="sekmeDegistir('canli')">CANLI TV</div>
      <div class="sekme" id="sekme-film" onclick="sekmeDegistir('film')">FİLM</div>
      <div class="sekme" id="sekme-dizi" onclick="sekmeDegistir('dizi')">DİZİ</div>
    </div>
  </div>
  <div id="oynatici">
    <video id="video" controls playsinline></video>
    <div id="kanalAdi"></div>
  </div>
  <div class="liste" id="liste"></div>
</div>

<script>
let SERVER="", USER="", PASS="", aktifSekme='

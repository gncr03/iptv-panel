<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPTV Giriş</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
body {
  background: #0a0a0f;
  color: white;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background-image: radial-gradient(circle at 50% 0%, #1e1e2e 0%, #0a0a0f 60%);
}
.kutu {
  width: 100%;
  max-width: 380px;
  background: #15151f;
  border: 1px solid #2a2a3a;
  border-radius: 20px;
  padding: 28px 22px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.6);
  text-align: center;
}
.logo {
  width: 70px; height: 70px;
  background: #f5c518;
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  font-size: 34px; margin: 0 auto 14px;
}
h1 { font-size: 22px; margin-bottom: 4px; }
p { color: #9a9aab; font-size: 13px; margin-bottom: 22px; }
label { display: block; text-align: left; font-size: 12px; color: #aaa; margin: 12px 0 6px; }
input {
  width: 100%; padding: 13px 14px;
  background: #0f0f16; border: 1px solid #2a2a3a;
  border-radius: 12px; color: white; font-size: 15px; outline: none;
}
input:focus { border-color: #f5c518; }
button {
  width: 100%; margin-top: 22px; padding: 14px;
  background: #f5c518; border: none; border-radius: 12px;
  font-size: 16px; font-weight: bold; cursor: pointer;
}
button:active { opacity: 0.85; }
.alt { margin-top: 14px; font-size: 11px; color: #666; }
</style>
</head>
<body>
<div class="kutu">
  <div class="logo">📺</div>
  <h1>IPTV Panel</h1>
  <p>Yayınları izlemek için giriş yap</p>

  <label>Sunucu Adresi</label>
  <input id="server" type="text" placeholder="http://ornek.com:8080" value="http://2233030.cc:8080">

  <label>Kullanıcı Adı</label>
  <input id="user" type="text" placeholder="Kullanıcı adın">

  <label>Şifre</label>
  <input id="pass" type="password" placeholder="Şifren">

  <button onclick="giris()">GİRİŞ YAP</button>
  <div class="alt">Sadece yasal aboneliğin ile kullan</div>
</div>

<script>
function giris(){
  let s = document.getElementById('server').value;
  let u = document.getElementById('user').value;
  let p = document.getElementById('pass').value;
  if(!u || !p){ alert('Lütfen kullanıcı adı ve şifreni yaz'); return; }
  alert('Giriş deneniyor: ' + u);
  // Burada sunucuya bağlanma kodu olacak
}
</script>
</body>
</html>
